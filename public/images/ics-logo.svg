<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#a80b16"/>
      <stop offset="45%" stop-color="#80060f"/>
      <stop offset="100%" stop-color="#4a0208"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Crimson Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fde047" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with subtle binary texture -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle matrix binary background -->
  <g fill="#ffffff" opacity="0.07" font-family="'Courier New', monospace" font-size="9" font-weight="bold">
    <text x="20" y="30">01010101 10101010 01100101 11010011 00101101 10100110</text>
    <text x="20" y="50">11010010 01011011 10110101 01001010 11010010 01100101</text>
    <text x="20" y="70">01100101 00101101 11010010 10101010 01010101 11010011</text>
    <text x="20" y="90">10101010 11010011 01010101 00101101 11010010 10100110</text>
    <text x="20" y="420">01010101 10101010 01100101 11010011 00101101 10100110</text>
    <text x="20" y="440">11010010 01011011 10110101 01001010 11010010 01100101</text>
    <text x="20" y="460">01100101 00101101 11010010 10101010 01010101 11010011</text>
    <text x="20" y="480">10101010 11010011 01010101 00101101 11010010 10100110</text>
  </g>

  <!-- Central Crest Group -->
  <g filter="url(#shadow)" transform="translate(250, 230)">
    
    <!-- Outer Shield Contour (White + Red Border) -->
    <!-- Path centered at (0, 0) -->
    <path d="M -125,-100 
             L 125,-100 
             C 135,-40 140,50 125,100 
             C 110,150 50,195 0,215 
             C -50,195 -110,150 -125,100 
             C -140,50 -135,-40 -125,-100 Z" 
          fill="#ffffff" stroke="#991b1b" stroke-width="6"/>

    <!-- Red Ribbon Border Bands around Shield -->
    <!-- Left Ribbon: INTEGRATED -->
    <path d="M -122,-95 L -92,-95 C -105,40 -90,120 -40,165 L -55,180 C -115,130 -135,40 -122,-95 Z" fill="#991b1b" stroke="#ffffff" stroke-width="2"/>
    <!-- Right Ribbon: SOCIETY -->
    <path d="M 122,-95 L 92,-95 C 105,40 90,120 40,165 L 55,180 C 115,130 135,40 122,-95 Z" fill="#991b1b" stroke="#ffffff" stroke-width="2"/>
    <!-- Bottom Ribbon: COMPUTER -->
    <path d="M -90,140 C -45,190 45,190 90,140 C 95,160 50,210 0,215 C -50,210 -95,160 -90,140 Z" fill="#991b1b" stroke="#ffffff" stroke-width="2"/>

    <!-- Curved Text on Ribbons -->
    <!-- Left: INTEGRATED -->
    <text transform="translate(-112, 10) rotate(-85)" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">INTEGRATED</text>
    <!-- Right: SOCIETY -->
    <text transform="translate(112, 10) rotate(85)" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">SOCIETY</text>
    <!-- Bottom: COMPUTER -->
    <text transform="translate(0, 185)" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" letter-spacing="4" text-anchor="middle">COMPUTER</text>

    <!-- Inner Shield (Black background divided into 4 quadrants) -->
    <g>
      <clipPath id="innerShieldClip">
        <path d="M -92,-95 L 92,-95 C 100,-20 95,60 0,160 C -95,60 -100,-20 -92,-95 Z"/>
      </clipPath>

      <g clip-path="url(#innerShieldClip)">
        <!-- Dark Base -->
        <rect x="-105" y="-105" width="210" height="280" fill="#090d16"/>

        <!-- QUADRANT 1 (Top-Left): Matrix Binary Code -->
        <rect x="-105" y="-105" width="105" height="125" fill="#0f172a"/>
        <g fill="#ffffff" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="2">
          <text x="-95" y="-80">01010101</text>
          <text x="-95" y="-62">10101010</text>
          <text x="-95" y="-44">01010101</text>
          <text x="-95" y="-26">10101010</text>
          <text x="-95" y="-8">01010101</text>
          <text x="-95" y="10">10101010</text>
        </g>

        <!-- QUADRANT 2 (Top-Right): Golden Gears / Cogs -->
        <rect x="0" y="-105" width="105" height="125" fill="#18181b"/>
        <!-- Large Central Gear -->
        <g fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5">
          <!-- Main gear center (45, -45) -->
          <circle cx="48" cy="-45" r="22"/>
          <!-- Teeth around circle -->
          <rect x="44" y="-74" width="8" height="8" rx="2"/>
          <rect x="44" y="-24" width="8" height="8" rx="2"/>
          <rect x="19" y="-49" width="8" height="8" rx="2"/>
          <rect x="69" y="-49" width="8" height="8" rx="2"/>
          <rect x="29" y="-66" width="8" height="8" rx="2" transform="rotate(45 33 -62)"/>
          <rect x="59" y="-36" width="8" height="8" rx="2" transform="rotate(45 63 -32)"/>
          <rect x="59" y="-66" width="8" height="8" rx="2" transform="rotate(-45 63 -62)"/>
          <rect x="29" y="-36" width="8" height="8" rx="2" transform="rotate(-45 33 -32)"/>
          <!-- Inner hole -->
          <circle cx="48" cy="-45" r="10" fill="#18181b" stroke="#78350f" stroke-width="1.5"/>
          <circle cx="48" cy="-45" r="4" fill="url(#goldGrad)"/>

          <!-- Smaller interlocking gear (15, -8) -->
          <circle cx="16" cy="-12" r="13"/>
          <rect x="13" y="-29" width="6" height="6" rx="1"/>
          <rect x="13" y="1" width="6" height="6" rx="1"/>
          <rect x="-2" y="-15" width="6" height="6" rx="1"/>
          <rect x="28" y="-15" width="6" height="6" rx="1"/>
          <circle cx="16" cy="-12" r="5" fill="#18181b"/>

          <!-- Top small gear (78, -12) -->
          <circle cx="76" cy="-10" r="11"/>
          <circle cx="76" cy="-10" r="4" fill="#18181b"/>
        </g>

        <!-- QUADRANT 3 (Bottom-Left): Yellow/Gold Honeycomb Pattern -->
        <rect x="-105" y="20" width="105" height="150" fill="#1c1917"/>
        <g stroke="#000000" stroke-width="3" fill="url(#goldGrad)">
          <!-- Hexagons -->
          <!-- Hex 1 -->
          <polygon points="-50,30 -35,39 -35,57 -50,66 -65,57 -65,39"/>
          <!-- Hex 2 -->
          <polygon points="-20,48 -5,57 -5,75 -20,84 -35,75 -35,57"/>
          <!-- Hex 3 -->
          <polygon points="-50,66 -35,75 -35,93 -50,102 -65,93 -65,75"/>
          <!-- Hex 4 -->
          <polygon points="-80,48 -65,57 -65,75 -80,84 -95,75 -95,57"/>
          <!-- Hex 5 -->
          <polygon points="-20,84 -5,93 -5,111 -20,120 -35,111 -35,93"/>
          <!-- Hex 6 -->
          <polygon points="-50,102 -35,111 -35,129 -50,138 -65,129 -65,111"/>
          <!-- Hex 7 -->
          <polygon points="-80,84 -65,93 -65,111 -80,120 -95,111 -95,93"/>
          <!-- Bottom Center Hex -->
          <polygon points="-20,120 -5,129 -5,147 -20,156 -35,147 -35,129"/>
        </g>

        <!-- QUADRANT 4 (Bottom-Right): White Circuit Board Traces with Nodes -->
        <rect x="0" y="20" width="105" height="150" fill="#090d16"/>
        <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- Trace 1 -->
          <path d="M 15,30 L 15,65 L 35,85 L 35,130"/>
          <circle cx="15" cy="30" r="3.5" fill="#ffffff" stroke="none"/>
          <circle cx="35" cy="130" r="3.5" fill="#ffffff" stroke="none"/>

          <!-- Trace 2 -->
          <path d="M 35,35 L 55,55 L 55,100 L 70,115"/>
          <circle cx="35" cy="35" r="3.5" fill="#ffffff" stroke="none"/>
          <circle cx="70" cy="115" r="3.5" fill="#ffffff" stroke="none"/>

          <!-- Trace 3 -->
          <path d="M 70,40 L 70,75 L 85,90"/>
          <circle cx="70" cy="40" r="3.5" fill="#ffffff" stroke="none"/>
          <circle cx="85" cy="90" r="3.5" fill="#ffffff" stroke="none"/>

          <!-- Trace 4 -->
          <path d="M 20,95 L 10,105 L 10,135"/>
          <circle cx="20" cy="95" r="3" fill="#ffffff" stroke="none"/>
          <circle cx="10" cy="135" r="3" fill="#ffffff" stroke="none"/>

          <!-- Trace 5 -->
          <path d="M 50,75 L 30,95"/>
          <circle cx="50" cy="75" r="3" fill="#ffffff" stroke="none"/>
        </g>

        <!-- Quadrant Divider Cross -->
        <line x1="0" y1="-105" x2="0" y2="165" stroke="#ffffff" stroke-width="4"/>
        <line x1="-105" y1="20" x2="105" y2="20" stroke="#ffffff" stroke-width="4"/>
      </g>
    </g>

    <!-- Top Badge Header: "ICS" -->
    <!-- Distinctive blocky crimson 3D letters with thick white contour -->
    <g transform="translate(0, -118)" filter="url(#glow)">
      <!-- Drop / Outer Shadow Outline -->
      <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="78" font-weight="900" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" letter-spacing="4">ICS</text>
      <!-- Red Face -->
      <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="78" font-weight="900" fill="url(#crimsonGrad)" stroke="#7f1d1d" stroke-width="2" letter-spacing="4">ICS</text>
      <!-- Top Highlight -->
      <text x="0" y="-2" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="76" font-weight="900" fill="#dc2626" opacity="0.3" letter-spacing="4">ICS</text>
    </g>

  </g>

  <!-- Bottom Academic Year (2026 - 2027) -->
  <text x="250" y="475" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" letter-spacing="5" opacity="0.95">2026 - 2027</text>
</svg>
